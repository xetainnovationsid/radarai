services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell}
    volumes:
      - radar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD}@db:5432/radar
      RADAR_ENV: production
      RADAR_AUTH_REQUIRED: "true"
      RADAR_API_KEYS: ${RADAR_API_KEYS:?set RADAR_API_KEYS in your shell}
      RADAR_WEB_ORIGINS: ${RADAR_WEB_ORIGINS:?set RADAR_WEB_ORIGINS in your shell}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      RADAR_ALLOWED_EMAIL_DOMAINS: ${RADAR_ALLOWED_EMAIL_DOMAINS:-}
      RADAR_STORAGE_DIR: /var/lib/radar/private-images
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      RADAR_MODEL_ID: ${RADAR_MODEL_ID:-muse-spark-1.3}
      RADAR_CT_CHECKPOINT: /var/lib/radar/model-artifacts/ct-binary-densenet121.pt
      RADAR_TRUST_PROXY_HEADERS: ${RADAR_TRUST_PROXY_HEADERS:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - radar-private-images:/var/lib/radar/private-images
      - ${RADAR_MODEL_ARTIFACTS_DIR:-./apps/api/data/model-artifacts}:/var/lib/radar/model-artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  radar-postgres:
  radar-private-images:
